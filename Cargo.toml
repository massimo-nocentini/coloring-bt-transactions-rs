[package]
name = "coloring-bt-transactions"
version = "0.1.0"
edition = "2021"

[dependencies]
webgraph = { git = "https://github.com/vigna/webgraph-rs.git" }
non-layered-tidy-trees = { git = "https://github.com/massimo-nocentini/non-layered-tidy-trees-rs.git" }
# Only `tree-view` wants a windowing toolkit, and GTK is a C library: building
# against it needs its headers and pkg-config on the machine, which the rest of
# this crate has no reason to require.  Optional, so that `cargo test` and
# `cargo doc` keep working where they are not installed -- see the `gui` feature.
gtk4 = { version = "0.11", optional = true }
# `tree-jp2`'s codec.  This is the Rust port of OpenJPEG rather than a binding to
# it, so unlike GTK it needs nothing installed on the machine and can be an
# ordinary dependency.
openjp2 = "0.6"

[features]
# The windowed viewers, `tree-view` and `tx-view`.  `cargo run --features gui
# --bin tree-view -- <graph>`, or `make view GRAPH=<graph>`.
gui = ["dep:gtk4"]

# Named here only to say that they do not build without GTK; the rest of the
# binaries under src/bin/ are found by cargo on its own.
[[bin]]
name = "tree-view"
path = "src/bin/tree-view.rs"
required-features = ["gui"]

# The same window over transactions rather than over a webgraph, coloured by
# where each one's coins came from.  `make tx-view RECORDS=<file>`.
[[bin]]
name = "tx-view"
path = "src/bin/tx-view.rs"
required-features = ["gui"]

# openjp2 0.6.1's *decoder* hands `dealloc` a code block's `decoded_data`
# without checking whether it is null, twice, and Rust's UB preconditions abort
# the process on it -- so `tree-jp2`'s round-trip assertions cannot run in a test
# build without this.  The upstream repository has neither fixed it nor released
# anything since, so there is no version to move to.
#
# This silences the check rather than the bug, which is worth being plain about.
# What makes it tolerable is where the bug is: `free(NULL)` is a no-op on every
# allocator this runs on, which is why release builds have always been fine, and
# nothing this crate *writes* reaches the code at all -- the encoder guards the
# same frees, and only the tests ever decode.  Naming the package keeps the
# checks on everywhere else, our own code included.
[profile.dev.package.openjp2]
debug-assertions = false

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
